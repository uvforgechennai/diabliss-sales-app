name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/diabliss-sales-app/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md

      - name: Broadcast force-refresh to installed apps
        run: |
          curl -sS -X POST 'https://script.google.com/macros/s/AKfycbzUWaomaTBhuUyce2HZ44o8I3m2Q1Nl7pEpat6qFPpE1cWZZDh18OeGN9RYted2a6hv/exec' \
            -H 'Content-Type: text/plain' \
            -d '{"action":"sendForceRefresh","broadcast":true}' \
            || true