name: Mirror orders/ to diabliss-orders

on:
  push:
    branches: [main]
    paths:
      - 'orders/**'
      - '!orders/gas/**'

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout diabliss-sales-app
        uses: actions/checkout@v4

      - name: Checkout diabliss-orders
        uses: actions/checkout@v4
        with:
          repository: uvforgechennai/diabliss-orders
          token: ${{ secrets.ORDERS_MIRROR_TOKEN }}
          path: diabliss-orders

      - name: Sync orders/ content into diabliss-orders
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='gas/' \
            --exclude='README.md' \
            orders/ diabliss-orders/

      - name: Commit and push if changed
        run: |
          cd diabliss-orders
          git config user.name "diabliss-orders-mirror-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to mirror"
            exit 0
          fi
          git commit -m "Mirror orders/ from diabliss-sales-app@${{ github.sha }}"
          git push
