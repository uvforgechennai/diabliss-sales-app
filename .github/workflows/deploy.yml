name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build JS bundle
        run: node build.js

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/diabliss-sales-app/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            build.js
            pricing.js
            app-core.js
            app-ui-helpers.js
            app-visit-flow.js
            app-admin-master.js
            app-dash-reports.js
            app-corrections.js
            app-targets-expenses.js
            app-ledger-invoice.js
            app-data-sync.js
            app-features-new.js
            app-features-v2.js
            app-chatbot.js